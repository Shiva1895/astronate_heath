
spring.application.name=astra-health-backend

spring.datasource.url=${ASTRA_DATABASE_URL:jdbc:postgresql://localhost:5432/astra_health_db}
spring.datasource.username=${ASTRA_DATABASE_USERNAME:postgres}
spring.datasource.password=${ASTRA_DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.servlet.multipart.max-file-size=${ASTRA_AUDIO_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${ASTRA_AUDIO_MAX_REQUEST_SIZE:11MB}
astra.audio.storage-dir=${ASTRA_AUDIO_STORAGE_DIR:${user.home}/.astra-health/audio}
astra.audio.max-file-size=${ASTRA_AUDIO_MAX_FILE_SIZE_BYTES:10485760}
astra.security.cors.allowed-origins=${ASTRA_CORS_ALLOWED_ORIGINS:http://localhost:5173}
springdoc.api-docs.enabled=${ASTRA_OPENAPI_ENABLED:true}
springdoc.swagger-ui.enabled=${ASTRA_OPENAPI_ENABLED:true}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
